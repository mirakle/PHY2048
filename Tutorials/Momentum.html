<style>
:root{
  --bg:#eaf0f6; --surface:#ffffff; --surface-2:#f3f6fa; --ink:#14213d; --ink-2:#44506a;
  --line:#c9d3e0; --grid:#e1e7ef; --zero:#5b6780;
  --blue:#1d5bbf; --blue-bg:#e5eefc; --orange:#a84a00; --orange-fill:#f29a3a; --orange-bg:#fdf0e3;
  --green:#17703e; --green-bg:#e3f4ea; --red:#b42318; --red-bg:#fdeceb;
  --on-blue:#ffffff; --focus:#b43c00; --shadow:0 1px 0 rgba(20,33,61,.06), 0 8px 24px -14px rgba(20,33,61,.35);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1420; --surface:#152033; --surface-2:#1b283e; --ink:#e9eef6; --ink-2:#b3bfd3;
    --line:#2f3d55; --grid:#24324a; --zero:#8a98b2;
    --blue:#8bb8ff; --blue-bg:#1b2c4a; --orange:#ffb46b; --orange-fill:#e58a2e; --orange-bg:#3a2a18;
    --green:#74d6a0; --green-bg:#163526; --red:#ff9a91; --red-bg:#3d1c1c;
    --on-blue:#0d1420; --focus:#ffc46b; --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 30px -16px rgba(0,0,0,.8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1420; --surface:#152033; --surface-2:#1b283e; --ink:#e9eef6; --ink-2:#b3bfd3;
  --line:#2f3d55; --grid:#24324a; --zero:#8a98b2;
  --blue:#8bb8ff; --blue-bg:#1b2c4a; --orange:#ffb46b; --orange-fill:#e58a2e; --orange-bg:#3a2a18;
  --green:#74d6a0; --green-bg:#163526; --red:#ff9a91; --red-bg:#3d1c1c;
  --on-blue:#0d1420; --focus:#ffc46b; --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 30px -16px rgba(0,0,0,.8);
  color-scheme: dark;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html{ scroll-padding-top:calc(env(safe-area-inset-top,0px) + 96px); }
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Atkinson Hyperlegible', 'Segoe UI', Verdana, sans-serif;
  font-size:1.0625rem; line-height:1.6;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px; background-attachment: fixed;
}
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--surface); }
h1,h2,h3,h4{ font-family:'Fraunces', Georgia, 'Times New Roman', serif; line-height:1.2; color:var(--ink); }
a{ color:var(--blue); text-underline-offset:3px; }
:focus-visible{ outline:3px solid var(--focus); outline-offset:3px; border-radius:4px; }
.visually-hidden{ position:absolute!important; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
.skip{ position:absolute; left:12px; top:-60px; background:var(--blue); color:var(--on-blue); padding:10px 16px; border-radius:6px; z-index:50; font-weight:700; }
.skip:focus{ top:calc(env(safe-area-inset-top,0px) + 10px); }

/* top bar */
.topbar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--surface); border-bottom:1px solid var(--line); }
.topbar-in{ max-width:920px; margin:0 auto; padding:10px 20px; display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
.brand{ font-family:'Fraunces', Georgia, serif; font-weight:800; font-size:1.1rem; margin:0; flex:1 1 auto; }
.brand small{ font-family:'Atkinson Hyperlegible', sans-serif; font-weight:400; color:var(--ink-2); font-size:.9rem; margin-left:8px; }
.prog{ flex:1 1 280px; min-width:240px; }
.prog-label{ display:flex; justify-content:space-between; gap:12px; font-size:.92rem; color:var(--ink-2); }
.prog-label strong{ color:var(--ink); }
.prog-track{ height:10px; border-radius:6px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden; margin-top:4px; }
.prog-fill{ height:100%; width:0; background:repeating-linear-gradient(135deg, var(--blue) 0 6px, color-mix(in srgb, var(--blue) 70%, var(--surface)) 6px 9px); transition:width .4s ease; }

main{ max-width:920px; margin:0 auto; padding:28px 20px 64px; }
.unit, .welcome, .finish{ background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:28px clamp(18px,4vw,40px) 32px; }

/* welcome */
.welcome h1{ font-size:clamp(2rem,6vw,3.2rem); margin:.2em 0 .25em; font-weight:800; letter-spacing:-.01em; }
.welcome .lede{ font-size:1.15rem; color:var(--ink-2); max-width:62ch; margin:0 0 1.4em; }
.hero-fig{ margin:0 0 1.5em; }
.rules{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin:0 0 1.6em; padding:0; list-style:none; }
.rules li{ border-left:4px solid var(--blue); background:var(--surface-2); padding:12px 14px; border-radius:0 8px 8px 0; }
.rules strong{ display:block; }
.name-form{ display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; }
.name-form .field{ flex:1 1 260px; }
.name-form label{ display:block; font-weight:700; margin-bottom:6px; }
input[type=text]{ width:100%; font:inherit; padding:12px 14px; border:2px solid var(--zero); border-radius:8px; background:var(--surface); color:var(--ink); min-height:48px; }
.field-err{ color:var(--red); font-weight:700; margin:6px 0 0; min-height:1.6em; }

/* section header */
.unit-head{ display:flex; gap:18px; align-items:center; margin-bottom:10px; }
.unit-letter{
  font-family:'Fraunces', Georgia, serif; font-weight:800; font-size:4.6rem; line-height:.9; flex:none; width:1.1em; text-align:center;
  color:transparent; -webkit-text-stroke:2px var(--orange);
  background:repeating-linear-gradient(135deg, var(--orange-fill) 0 3px, transparent 3px 8px); -webkit-background-clip:text; background-clip:text;
}
.unit-kicker{ margin:0; color:var(--ink-2); font-size:.95rem; }
.unit-head h2{ margin:.05em 0 0; font-size:clamp(1.5rem,4vw,2.1rem); }
.unit-head h2:focus{ outline:none; }
.unit-head h2:focus-visible{ outline:3px solid var(--focus); }
.prose{ max-width:68ch; }
.prose p{ margin:.7em 0; }
.prose ol, .prose ul{ padding-left:1.3em; }
.prose li{ margin:.35em 0; }
.key{ border-left:4px solid var(--orange); background:var(--orange-bg); padding:10px 14px; border-radius:0 8px 8px 0; }
.example{ background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:4px 16px; }
.example-title{ font-weight:700; margin-top:.8em!important; }
mjx-container[display="true"]{ overflow-x:auto; overflow-y:hidden; max-width:100%; padding:2px 0; }

/* figures / charts */
.fig{ margin:1.2em 0; }
.fig figcaption{ font-size:.95rem; color:var(--ink-2); margin-top:6px; max-width:68ch; }
.chart{ width:100%; height:auto; display:block; background:var(--surface); border:1px solid var(--line); border-radius:8px; }
.chart text{ font-family:'Atkinson Hyperlegible', sans-serif; }
.c-grid{ stroke:var(--grid); stroke-width:1; }
.c-zero{ stroke:var(--zero); stroke-width:2; }
.c-frame{ fill:none; stroke:var(--line); }
.c-tick{ fill:var(--ink-2); font-size:15px; }
.c-label{ fill:var(--ink); font-size:16px; font-weight:700; }
.c-line{ fill:none; stroke:var(--blue); stroke-width:3; stroke-linejoin:round; }
.c-line.p-line{ stroke:var(--orange); }
.c-line.dash{ stroke-dasharray:7 6; stroke-width:2; stroke:var(--ink-2); }
.c-cursor{ stroke:var(--ink); stroke-width:2; stroke-dasharray:4 4; }
.c-dot{ fill:var(--orange); stroke:var(--surface); stroke-width:2; }
.c-note{ fill:var(--ink); font-size:15px; font-weight:700; }
.pp-bg{ fill:color-mix(in srgb, var(--blue) 14%, transparent); } .pp-line{ stroke:var(--blue); stroke-width:2; }
.np-bg{ fill:color-mix(in srgb, var(--red) 14%, transparent); } .np-line{ stroke:var(--red); stroke-width:1.6; }
.legend-key{ display:inline-block; width:22px; height:14px; vertical-align:-2px; margin-right:6px; border:1.5px solid; border-radius:2px; }
.lk-pos{ border-color:var(--blue); background:repeating-linear-gradient(45deg, var(--blue) 0 2px, transparent 2px 6px); }
.lk-neg{ border-color:var(--red); background:repeating-linear-gradient(45deg, var(--red) 0 1.5px, transparent 1.5px 6px), repeating-linear-gradient(-45deg, var(--red) 0 1.5px, transparent 1.5px 6px); }

/* simulations */
.sim{ margin:1.8em 0; border:2px solid var(--blue); border-radius:12px; padding:18px clamp(14px,3vw,24px) 20px; background:var(--surface-2); }
.sim-h{ font-size:1.25rem; margin:0 0 .3em; }
.sim-h .tag{ font-family:'Atkinson Hyperlegible',sans-serif; font-size:.85rem; font-weight:700; background:var(--blue); color:var(--on-blue); padding:2px 9px; border-radius:20px; vertical-align:3px; margin-right:6px; }
.sim-intro{ margin:0 0 1em; color:var(--ink-2); max-width:68ch; }
.ctls{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px 20px; margin:6px 0 10px; }
.ctl-top{ display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
.ctl label{ font-weight:700; font-size:.97rem; }
.ctl output{ font-variant-numeric:tabular-nums; font-weight:700; color:var(--orange); white-space:nowrap; }
input[type=range]{ width:100%; accent-color:var(--blue); min-height:32px; cursor:pointer; }
select{ font:inherit; width:100%; padding:9px 10px; border-radius:8px; border:2px solid var(--zero); background:var(--surface); color:var(--ink); min-height:44px; margin-top:4px; }
.timebar{ display:flex; gap:14px; align-items:flex-end; flex-wrap:wrap; margin-top:8px; }
.timebar .ctl{ flex:1 1 260px; }
.stage{ width:100%; height:auto; display:block; background:var(--surface); border:1px solid var(--line); border-radius:8px; }
.stage text{ font-family:'Atkinson Hyperlegible', sans-serif; fill:var(--ink); font-size:16px; }
.stage .muted{ fill:var(--ink-2); font-size:14px; }
.stage .ground{ stroke:var(--zero); stroke-width:3; }
.stage .cart{ fill:var(--surface-2); stroke:var(--ink); stroke-width:2.5; }
.stage .wheel{ fill:var(--ink); }
.arr-v.shaft{ stroke:var(--blue); stroke-width:4; } .arr-v.head, .arr-v.dot{ fill:var(--blue); }
.arr-p.shaft{ stroke:var(--orange); stroke-width:8; } .arr-p.head, .arr-p.dot{ fill:var(--orange); }
.ball1{ fill:var(--blue); stroke:var(--ink); stroke-width:2; } .ball2{ fill:var(--orange-fill); stroke:var(--ink); stroke-width:2; }
.stage .ball1-t{ fill:var(--on-blue); font-weight:700; } .stage .ball2-t{ fill:#1a1206; font-weight:700; }
.bar-pos{ fill:var(--blue); } .bar-neg{ fill:var(--red); }
.readouts{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin:12px 0 0; }
.readouts div{ background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:8px 12px; }
.readouts dt{ font-size:.9rem; color:var(--ink-2); }
.readouts dd{ margin:0; font-size:1.25rem; font-weight:700; font-variant-numeric:tabular-nums; }
.eq-readout{ font-size:1.1rem; margin:.8em 0 0; font-variant-numeric:tabular-nums; }
.note{ font-size:.95rem; color:var(--ink-2); }
.warnline{ color:var(--red); font-weight:700; }
.table-wrap{ overflow-x:auto; margin-top:12px; border-radius:8px; border:1px solid var(--line); }
table.data{ border-collapse:collapse; width:100%; background:var(--surface); font-variant-numeric:tabular-nums; font-size:.97rem; }
table.data caption{ text-align:left; font-weight:700; padding:8px 12px; }
table.data th, table.data td{ padding:8px 12px; border-top:1px solid var(--line); text-align:right; white-space:nowrap; }
table.data th:first-child, table.data td:first-child{ text-align:left; }
table.data thead th{ background:var(--surface-2); font-size:.9rem; }

/* buttons */
.btn{ font:inherit; font-weight:700; border-radius:8px; padding:10px 18px; min-height:46px; cursor:pointer; border:2px solid var(--blue); }
.btn.primary{ background:var(--blue); color:var(--on-blue); }
.btn.ghost{ background:transparent; color:var(--blue); }
.btn:hover:not(:disabled){ filter:brightness(1.08); }
.btn.ghost:hover:not(:disabled){ background:var(--blue-bg); }
.btn:disabled{ cursor:not-allowed; background:var(--surface-2); color:var(--ink-2); border-color:var(--line); }

/* questions */
.q{ margin:2em 0 0; border:1px solid var(--line); border-radius:12px; padding:18px clamp(14px,3vw,24px); background:var(--surface); position:relative; }
.q::before{ content:""; position:absolute; left:-1px; top:14px; bottom:14px; width:5px; border-radius:0 4px 4px 0; background:var(--orange); }
.q-top{ display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:baseline; }
.q-num{ margin:0; font-size:1.2rem; }
.q-pts{ font-size:.95rem; color:var(--ink-2); font-weight:700; }
.q fieldset{ border:0; padding:0; margin:.6em 0 0; min-width:0; }
.q legend{ padding:0; font-size:1.08rem; max-width:68ch; margin-bottom:.4em; }
.opts{ display:grid; gap:10px; margin-top:12px; }
.opt{ position:relative; }
.opt input{ position:absolute; left:16px; top:50%; transform:translateY(-50%); width:22px; height:22px; margin:0; accent-color:var(--blue); }
.opt label{ display:flex; align-items:center; gap:12px; padding:12px 14px 12px 50px; border:2px solid var(--line); border-radius:10px; cursor:pointer; min-height:52px; flex-wrap:wrap; }
.opt input:checked + label{ border-color:var(--blue); background:var(--blue-bg); box-shadow:inset 0 0 0 1px var(--blue); }
.opt input:focus-visible + label{ outline:3px solid var(--focus); outline-offset:2px; }
.opt input:disabled + label{ cursor:default; }
.opt-letter{ font-weight:800; font-family:'Fraunces', Georgia, serif; color:var(--ink-2); min-width:1.2em; }
.opt-text{ font-variant-numeric:tabular-nums; flex:1 1 auto; }
.opt-status{ font-weight:700; font-size:.92rem; padding:2px 10px; border-radius:20px; }
.opt-status:empty{ display:none; }
.opt.wrong input + label{ border-color:var(--red); background:var(--red-bg); border-style:dashed; }
.opt.wrong .opt-status{ color:var(--red); border:1.5px solid var(--red); }
.opt.right input + label{ border-color:var(--green); background:var(--green-bg); border-width:3px; box-shadow:none; }
.opt.right .opt-status{ color:var(--green); border:1.5px solid var(--green); }
.q-actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
.hint{ margin-top:12px; background:var(--orange-bg); border-radius:8px; padding:4px 14px; border-left:4px solid var(--orange); }
.fb:empty{ display:none; }
.fb p{ margin:12px 0 0; padding:10px 14px; border-radius:8px; }
.fb .ok{ background:var(--green-bg); color:var(--ink); border-left:5px solid var(--green); }
.fb .bad{ background:var(--red-bg); color:var(--ink); border-left:5px solid var(--red); }
.fb .warn{ background:var(--surface-2); border-left:5px solid var(--zero); }
.sol{ margin-top:14px; border-top:2px dashed var(--line); padding-top:6px; }
.sol h4{ font-size:1.1rem; margin:.6em 0 .2em; }
.sol h4:focus{ outline:none; } .sol h4:focus-visible{ outline:3px solid var(--focus); }
.sol .check{ font-size:.97rem; color:var(--ink-2); }

.unit-nav{ display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; margin-top:2.2em; padding-top:18px; border-top:1px solid var(--line); }
.nav-right{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-left:auto; }
.gate{ margin:0; color:var(--ink-2); font-size:.95rem; max-width:34ch; text-align:right; }

/* finish */
.finish{ position:relative; overflow:hidden; text-align:center; }
.cert{ border:3px double var(--orange); border-radius:12px; padding:28px clamp(14px,4vw,40px); position:relative; background:var(--surface); }
.cert-kicker{ color:var(--ink-2); margin:0; }
.cert h2{ font-size:clamp(1.8rem,5vw,2.6rem); margin:.3em 0 .2em; }
.cert h2:focus{ outline:none; } .cert h2:focus-visible{ outline:3px solid var(--focus); }
.score-big{ font-family:'Fraunces', Georgia, serif; font-weight:800; font-size:clamp(3rem,10vw,5rem); line-height:1; margin:.2em 0 0; color:var(--orange); }
.score-sub{ margin:.2em 0 1em; font-size:1.1rem; }
.cert .stats{ display:flex; justify-content:center; gap:12px 26px; flex-wrap:wrap; list-style:none; padding:0; margin:0 0 1.2em; }
.cert .stats li{ font-size:1rem; }
.cert .stats strong{ font-size:1.3rem; }
.cert table.data{ max-width:520px; margin:0 auto; }
.cert-actions{ display:flex; justify-content:center; gap:12px; flex-wrap:wrap; margin-top:1.4em; }
.confetti{ position:absolute; inset:0; pointer-events:none; overflow:hidden; }
.confetti i{ position:absolute; top:-20px; width:10px; height:16px; opacity:.9; animation:fall linear forwards; }
@keyframes fall{ to{ transform:translateY(900px) rotate(540deg); opacity:0; } }
@media (prefers-reduced-motion: reduce){ .confetti{ display:none; } .prog-fill{ transition:none; } * { scroll-behavior:auto!important; } }
@media (max-width:560px){ .unit-letter{ font-size:3.2rem; } .gate{ text-align:left; } body{ font-size:1rem; } }
</style>

      <div class="prog-track" id="prog-track" role="progressbar" aria-label="Questions completed" aria-valuemin="0" aria-valuemax="12" aria-valuenow="0"><div class="prog-fill" id="prog-fill"></div></div>

<script>
/* =========================================================
   Settings
   ========================================================= */
const PTS_FIRST = 5;      // points for a correct answer on attempt 1
const PTS_SECOND = 3;     // points for a correct answer on attempt 2
const STORE_KEY = 'phy2048-momentum-tutorial-v1';
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

/* =========================================================
   Helpers
   ========================================================= */
const $ = id => document.getElementById(id);
function fmt(x, d = 1) {
  const r = Number(x.toFixed(d));
  if (Object.is(r, -0) || Math.abs(r) < Math.pow(10, -d) / 2) return (0).toFixed(d);
  return (r < 0 ? '\u2212' : '') + Math.abs(r).toFixed(d);
}
function fmtS(x, d = 1) { const s = fmt(x, d); return (x > 0 && Number(s) !== 0 ? '+' : '') + s; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function niceStep(range, target = 5) { const raw = range / target; const p = Math.pow(10, Math.floor(Math.log10(raw))); const f = raw / p; return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p; }
function niceRange(lo, hi, target = 5) {
  if (hi - lo < 1e-9) { hi = lo + 1; }
  const s = niceStep(hi - lo, target);
  let a = Math.floor(lo / s + 1e-9) * s, b = Math.ceil(hi / s - 1e-9) * s;
  if (Math.abs(b - hi) < s * 0.08) b += s;
  if (lo < 0 && Math.abs(a - lo) < s * 0.08) a -= s;
  return [a, b, s];
}

/* piecewise-linear force functions: arrays of [t, F] */
function evalPL(v, t) {
  if (t < v[0][0] || t > v[v.length - 1][0]) return 0;
  let f = 0;
  for (let i = 0; i < v.length - 1; i++) {
    const [a, fa] = v[i], [b, fb] = v[i + 1];
    if (t >= a && t <= b) f = b > a ? fa + (fb - fa) * (t - a) / (b - a) : fb;
  }
  return f;
}
function withCrossings(v) {
  const out = [v[0]];
  for (let i = 1; i < v.length; i++) {
    const [t0, f0] = v[i - 1], [t1, f1] = v[i];
    if (f0 * f1 < 0 && t1 > t0) out.push([t0 + (t1 - t0) * f0 / (f0 - f1), 0]);

/* accessible SVG line chart with optional hatched area */
function chartSVG(o) {
  const W = 520, H = o.h || 290, m = { l: 62, r: 16, t: 16, b: 54 }, pw = W - m.l - m.r, ph = H - m.t - m.b;
  const X = t => m.l + (t - o.x0) / (o.x1 - o.x0) * pw, Y = f => m.t + ph - (f - o.y0) / (o.y1 - o.y0) * ph;
  const id = o.id, dec = s => Math.max(0, -Math.floor(Math.log10(s) + 1e-9));
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-labelledby="${id}-t ${id}-d" focusable="false">
  <title id="${id}-t">${esc(o.title)}</title><desc id="${id}-d">${esc(o.desc)}</desc>
  <defs><pattern id="${id}-pp" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" class="pp-bg"/><line x1="1" y1="0" x2="1" y2="8" class="pp-line"/></pattern>
  <pattern id="${id}-np" patternUnits="userSpaceOnUse" width="9" height="9"><rect width="9" height="9" class="np-bg"/><path d="M0 0L9 9M9 0L0 9" class="np-line"/></pattern></defs>`;
  const xd = dec(o.xs), yd = dec(o.ys);
  for (let k = Math.ceil(o.x0 / o.xs - 1e-9); k * o.xs <= o.x1 + 1e-9; k++) {
    const v = k * o.xs, x = X(v).toFixed(1);
    s += `<line x1="${x}" y1="${m.t}" x2="${x}" y2="${m.t + ph}" class="c-grid"/><text x="${x}" y="${m.t + ph + 21}" text-anchor="middle" class="c-tick">${fmt(v, xd)}</text>`;
  }
  for (let k = Math.ceil(o.y0 / o.ys - 1e-9); k * o.ys <= o.y1 + 1e-9; k++) {
    const v = k * o.ys, y = Y(v).toFixed(1);
    s += `<line x1="${m.l}" y1="${y}" x2="${m.l + pw}" y2="${y}" class="${Math.abs(v) < 1e-9 ? 'c-zero' : 'c-grid'}"/><text x="${m.l - 8}" y="${(+y + 5).toFixed(1)}" text-anchor="end" class="c-tick">${fmt(v, yd)}</text>`;
  }
  s += `<rect x="${m.l}" y="${m.t}" width="${pw}" height="${ph}" class="c-frame"/>`;
  if (o.shade) {
    const c = clipTo(withCrossings(o.shade.verts), o.shade.to);
    if (c.length > 1) {
      const t0 = c[0][0], t1 = c[c.length - 1][0];
      const poly = fn => [[t0, 0], ...c.map(p => [p[0], fn(p[1])]), [t1, 0]].map(p => X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1)).join(' ');
      s += `<polygon points="${poly(f => Math.max(f, 0))}" fill="url(#${id}-pp)"/>`;
      s += `<polygon points="${poly(f => Math.min(f, 0))}" fill="url(#${id}-np)"/>`;
    }
  }
  (o.lines || []).forEach(L => { s += `<polyline points="${L.pts.map(p => X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1)).join(' ')}" class="c-line ${L.cls || ''}"/>`; });
  if (o.overlay) s += o.overlay(X, Y);
  if (o.cursor != null) {
    const x = X(o.cursor).toFixed(1);
    s += `<line x1="${x}" y1="${m.t}" x2="${x}" y2="${m.t + ph}" class="c-cursor"/>`;
    if (o.cursorY != null) s += `<circle cx="${x}" cy="${Y(o.cursorY).toFixed(1)}" r="6" class="c-dot"/>`;
  }
  s += `<text x="${m.l + pw / 2}" y="${H - 8}" text-anchor="middle" class="c-label">${esc(o.xLabel)}</text>`;
  s += `<text transform="translate(17 ${m.t + ph / 2}) rotate(-90)" text-anchor="middle" class="c-label">${esc(o.yLabel)}</text></svg>`;
  return s;
}

function sliderHTML(id, label, min, max, step, val) {

function bindSlider(id, unit, dec, cb) {

const PLAY_HTML = '<span aria-hidden="true">\u25B6</span> Play', PAUSE_HTML = '<span aria-hidden="true">\u275A\u275A</span> Pause';
function makePlayer(slider, btn, msPerUnit, onDone) {
  let raf = null;
  const stop = () => { if (raf) { cancelAnimationFrame(raf); raf = null; } btn.innerHTML = PLAY_HTML; };
  const set = v => { slider.value = v; slider.dispatchEvent(new Event('input')); };
  btn.innerHTML = PLAY_HTML;
  btn.addEventListener('click', () => {
    if (raf) { stop(); onDone(); return; }
    const max = +slider.max; let v = +slider.value;
    if (v >= max - 1e-6) v = +slider.min;
    if (reduceMotion.matches) { set(max); onDone(); return; }
    btn.innerHTML = PAUSE_HTML; let last = null;
    const step = ts => {
      if (last == null) last = ts;
      v = Math.min(max, v + (ts - last) / msPerUnit); last = ts; set(v);
      if (v >= max) { raf = null; btn.innerHTML = PLAY_HTML; onDone(); return; }
      raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
  });
  slider.addEventListener('pointerdown', stop);
  slider.addEventListener('keydown', stop);
  return stop;
}

      \[\Delta p_{0\to 6} = +16.0 + (-12.0) = +4.0\ \mathrm{kg\cdot m/s}\]
      \[p_\text{final} = 24.0 + 4.0 = 28.0\ \mathrm{kg\cdot m/s}, \qquad v_\text{final} = \frac{28.0\ \mathrm{kg\cdot m/s}}{12.0\ \mathrm{kg}} = 2.33\ \mathrm{m/s}\]
      <p>The box sped up from 2.0 m/s to 3.33 m/s, then the backward pull slowed it to 2.33 m/s.</p>`,
    solFig: ['tri2', 6, 'Hatched upper triangle: +16.0 N·s. Cross-hatched lower triangle: −12.0 N·s. Net impulse +4.0 N·s.'] },
  q10: { stem: String.raw`A box of mass \(m = 0.5\ \mathrm{kg}\) is pushed from rest with the time-dependent force \(F(t) = 3\left(1 - e^{-2t}\right)\) (in newtons, with \(t\) in seconds) from \(t = 0\) until \(t = 0.5\ \mathrm{s}\). What is the speed of the box at \(t = 0.5\ \mathrm{s}\)?`,
    fig: 'q10', options: ['1.1 m/s', '1.9 m/s', '4.1 m/s', '0.55 m/s'], correct: 0,
    why: [null, 'The force is not constant, so you cannot multiply F(0.5) by Δt. Integrate.', 'Evaluate the antiderivative at the lower limit too, and subtract its value at t = 0.', 'That is Δp ≈ 0.552 kg·m/s. Divide by the mass to get the speed.'],
    hint: String.raw`\(\Delta p = \displaystyle\int_0^{0.5} 3\left(1 - e^{-2t}\right)dt\). An antiderivative of \(e^{-2t}\) is \(-\tfrac12 e^{-2t}\). Evaluate at both limits.`,
    solution: String.raw`<p>Integrate the force over the time it acts:</p>
      \[\Delta p = \int_0^{0.5} 3\left(1 - e^{-2t}\right)dt = 3\left[\,t + \tfrac12 e^{-2t}\right]_0^{0.5}\]
      \[= 3\left[\left(0.5 + \tfrac12 e^{-1}\right) - \left(0 + \tfrac12\right)\right] = \tfrac32 e^{-1} \approx 0.552\ \mathrm{kg\cdot m/s}\]
      <p>The box starts at rest, so \(p_\text{final} = \Delta p = 0.552\ \mathrm{kg\cdot m/s}\) and</p>
      \[v_\text{final} = \frac{p_\text{final}}{m} = \frac{0.552\ \mathrm{kg\cdot m/s}}{0.5\ \mathrm{kg}} \approx 1.1\ \mathrm{m/s}\]
      <p class="check">Sanity check: the force never exceeds 1.90 N, so the impulse must be less than (1.90 N)(0.5 s) = 0.95 N·s. 0.552 N·s fits.</p>`,
    solFig: ['q10', 0.5, 'Shaded: the area under F(t) from 0 to 0.5 s, about 0.552 N·s.'] },
  q11: { stem: String.raw`Two skaters, \(m_1 = 55\ \mathrm{kg}\) and \(m_2 = 45\ \mathrm{kg}\), stand at rest facing each other. At \(t = 0\) they push off, and skater 2 moves away with velocity \(v_{2f} = +5.0\ \mathrm{m/s}\). What is the velocity of skater 1?`,
    options: ['\u22124.09 m/s', '+4.09 m/s', '\u22126.11 m/s', '\u22125.0 m/s'], correct: 0,
    why: [null, 'The total momentum must stay zero, so skater 1 has to move opposite to skater 2.', 'Check which mass goes with which velocity: 55 kg multiplies v₁f.', 'The momenta are equal and opposite, not the speeds. The heavier skater moves more slowly.'],
    hint: String.raw`The system starts at rest and no external horizontal force acts, so \(p_{1f} + p_{2f} = 0\).`,
    solution: String.raw`<p>The total momentum starts at zero and the push is internal to the two-skater system, so it stays zero:</p>
      \[m_1v_{1f} + m_2v_{2f} = 0 \quad\Rightarrow\quad (55\ \mathrm{kg})\,v_{1f} + (45\ \mathrm{kg})(5.0\ \mathrm{m/s}) = 0\]
      \[55\,v_{1f} = -225 \quad\Rightarrow\quad v_{1f} = -\frac{225}{55} = -4.09\ \mathrm{m/s}\]
      <p>Skater 1 moves in the negative direction, more slowly than skater 2 because she is heavier. Both skaters have momentum of size 225 kg·m/s, in opposite directions.</p>` },
  q12: { stem: String.raw`A ball of mass \(m_1 = 0.8\ \mathrm{kg}\) moving with \(v_{1i} = +1.2\ \mathrm{m/s}\) collides head-on with a ball of mass \(m_2 = 0.6\ \mathrm{kg}\) moving with \(v_{2i} = -2.5\ \mathrm{m/s}\). The coefficient of restitution is \(r = 0.4\). What are the final velocities?`,
    options: ['Ball 1: \u22121.02 m/s; ball 2: +0.46 m/s', 'Ball 1: \u22120.39 m/s; ball 2: \u22120.39 m/s', 'Ball 1: \u22121.97 m/s; ball 2: +1.73 m/s', 'Ball 1: +0.46 m/s; ball 2: \u22121.02 m/s'], correct: 0,
    why: [null, 'Those are the velocities for r = 0, when the balls stick together. Here r = 0.4.', 'Those are the velocities for an elastic collision, r = 1. Here r = 0.4.', 'Those values are swapped and do not conserve momentum: (0.8)(0.46) + (0.6)(−1.02) ≠ −0.54.'],
    hint: String.raw`Write two equations. Momentum: \(m_1v_{1i} + m_2v_{2i} = m_1v_{1f} + m_2v_{2f}\). Restitution: \(v_{2f} - v_{1f} = r\,(v_{1i} - v_{2i})\). Solve them together.`,
    solution: String.raw`<p><strong>1. Conservation of momentum.</strong></p>
      \[(0.8)(1.2) + (0.6)(-2.5) = 0.8\,v_{1f} + 0.6\,v_{2f} \quad\Rightarrow\quad -0.54 = 0.8\,v_{1f} + 0.6\,v_{2f}\]
      <p><strong>2. Coefficient of restitution.</strong></p>
      \[v_{2f} - v_{1f} = r\,(v_{1i} - v_{2i}) = 0.4\,\big(1.2 - (-2.5)\big) = 0.4\,(3.7) = 1.48\ \mathrm{m/s}\]
      <p><strong>3. Solve.</strong> Substitute \(v_{2f} = v_{1f} + 1.48\) into the momentum equation:</p>
      \[-0.54 = 0.8\,v_{1f} + 0.6\,(v_{1f} + 1.48) = 1.4\,v_{1f} + 0.888\]
      \[v_{1f} = \frac{-0.54 - 0.888}{1.4} = \frac{-1.428}{1.4} = -1.02\ \mathrm{m/s}, \qquad v_{2f} = -1.02 + 1.48 = +0.46\ \mathrm{m/s}\]
      <p class="check">Check momentum: \((0.8)(-1.02) + (0.6)(0.46) = -0.816 + 0.276 = -0.54\ \mathrm{kg\cdot m/s}\). ✓ Both balls bounce back. Try these numbers in the collision simulator above.</p>` }
};

/* =========================================================
   Sections
   ========================================================= */
const SECTIONS = [
  { letter: 'A', title: 'What is momentum?', qs: ['q1'], sim: 'momentum',
    simTitle: 'Momentum of a cart', simIntro: 'Change the mass and velocity. The blue arrow is the velocity; the thicker orange arrow is the momentum. They always point the same way.',
    intro: String.raw`<p>Momentum is the product of mass and velocity:</p>
      \[\vec p = m\,\vec v\]
      <p>Mass is always positive, so the momentum vector points in the same direction as the velocity vector. In this tutorial every problem is one-dimensional, so we drop the arrows and let the <strong>sign</strong> carry the direction: positive for motion in the + direction (to the right), negative for motion in the − direction.</p>
      \[p = mv \qquad\text{units: } \mathrm{kg\cdot m/s}\]
      <div class="example"><p class="example-title">Example</p><p>A 2.0 kg object moving with \(v = 3.0\ \mathrm{m/s}\) has \(p = (2.0\ \mathrm{kg})(3.0\ \mathrm{m/s}) = 6.0\ \mathrm{kg\cdot m/s}\).</p></div>` },
  { letter: 'B', title: 'Rate of change of momentum', qs: ['q2', 'q3'], sim: 'rate',
    simTitle: 'The slope of p(t) is the net force', simIntro: 'A constant net force acts on a cart. The orange line is the cart’s momentum over 5 seconds. Change the force and the mass, and watch which one controls the slope.',
    intro: String.raw`<p>The momentum of an object changes if its mass changes, its velocity changes, or both:</p>
      \[\frac{dp}{dt} = \frac{d(mv)}{dt} = \frac{dm}{dt}\,v + m\,\frac{dv}{dt}\]
      <p>A rocket that burns fuel and gets lighter is a changing-mass system. In this course we keep the mass constant, so \(dm/dt = 0\) and</p>
      \[\frac{dp}{dt} = m\frac{dv}{dt} = ma = F_\text{net}\]
      <p class="key">To change an object’s momentum, apply a net force. If the net force is zero, the momentum does not change: momentum is <strong>conserved</strong>.</p>
      <p>Over a finite time interval this becomes \(F_\text{net} = \dfrac{\Delta p}{\Delta t}\).</p>` },
  { letter: 'C', title: 'Impulse: the area under the force curve', qs: ['q4', 'q5', 'q6'], sim: 'impulse',
    simTitle: 'Impulse explorer', simIntro: 'Pick a force shape and slide the time t. The hatched area under the force curve up to t equals the change in momentum, and the momentum graph below rises or falls by exactly that amount.',
    intro: String.raw`<p>Reverse the relationship \(dp = F\,dt\) and integrate to find how much the momentum changes while a force acts:</p>
      \[\Delta p = p_\text{final} - p_\text{initial} = \int_{t_\text{initial}}^{t_\text{final}} F\,dt\]
      <p>This change in momentum is called the <strong>impulse</strong>. Its units are \(\mathrm{N\cdot s}\), which are the same as \(\mathrm{kg\cdot m/s}\). There are three ways to evaluate it:</p>
      <ol>
        <li><strong>F is constant:</strong> \(\Delta p = F\,(t_\text{final} - t_\text{initial}) = F\,\Delta t\).</li>
        <li><strong>F is given as a graph with a simple shape:</strong> \(\Delta p\) is the area under the curve. Area below the time axis counts as negative.</li>
        <li><strong>F is given as a function F(t):</strong> evaluate the integral with calculus (section E).</li>
      </ol>
      <p class="key">Once you have the impulse: \(p_\text{final} = p_\text{initial} + \Delta p\), then \(v_\text{final} = p_\text{final}/m\).</p>` },
  { letter: 'D', title: 'When the force changes direction', qs: ['q7', 'q8', 'q9'], sim: null,
    intro: String.raw`<p>When the force reverses, the area below the time axis is a negative impulse: it removes momentum in the + direction. Questions 7 to 9 all use the force graph below, applied to a box of mass \(m = 12.0\ \mathrm{kg}\) initially moving with \(v = 2.0\ \mathrm{m/s}\). Its initial momentum is</p>
      \[p_\text{initial} = mv_\text{initial} = (12.0\ \mathrm{kg})(2.0\ \mathrm{m/s}) = 24.0\ \mathrm{kg\cdot m/s}\]
      <p>For each time, find the area from \(t = 0\) up to that time, add it to \(p_\text{initial}\), and divide by the mass.</p>`,
    introFig: ['tri2', null, 'Force on the 12.0 kg box. Upper triangle: from 0 to 4 s, peak 8 N at 2 s. Lower triangle: from 4 to 6 s, minimum −12 N at 5 s.'] },
  { letter: 'E', title: 'Force given as a function of time', qs: ['q10'], sim: null,
    intro: String.raw`<p>When the force is given as a formula \(F(t)\), the area under the curve is found exactly with an integral:</p>
      \[\Delta p = \int_{t_\text{initial}}^{t_\text{final}} F(t)\,dt\]
      <p>A useful result for this section: \(\displaystyle\int e^{kt}\,dt = \frac{1}{k}\,e^{kt}\). Do not replace a changing force by its final value: that overestimates the impulse whenever the force grows over time.</p>` },
  { letter: 'F', title: 'Conservation of momentum: explosions', qs: ['q11'], sim: 'explode',
    simTitle: 'Push-off on ice', simIntro: 'Two skaters start at rest and push off each other. Set their masses and how fast skater 2 leaves, then press Play or move the time slider. Watch the momentum bars: they are always equal and opposite.',
    intro: String.raw`<p>Now consider a <strong>system</strong> of two objects that are not tied together. Object 1 has momentum \(p_1 = m_1v_1\), object 2 has \(p_2 = m_2v_2\), and the system has</p>
      \[p_\text{system} = p_1 + p_2, \qquad \Delta p_\text{system} = F_\text{ext}\,\Delta t\]
      <p>If the net external force on the system is zero, \(\Delta p_\text{system} = 0\) and the momentum of the system is <strong>conserved</strong>. The parts can still move; only the total stays fixed.</p>
      <p>In an <strong>explosion</strong> (or a push-off), the two objects start together at rest, so \(p_\text{system} = 0\). The explosion is internal, so afterwards</p>
      \[p_{1f} + p_{2f} = 0\]
      <p>One momentum must be positive and the other negative. They cannot both be positive or both be negative.</p>` },
  { letter: 'G', title: 'Collisions and the coefficient of restitution', qs: ['q12'], sim: 'collide',
    simTitle: 'Collision lab', simIntro: 'Set the masses, initial velocities, and the coefficient of restitution r, then press Play or drag the time slider. The table updates with the velocities, momenta, and kinetic energies before and after.',
    intro: String.raw`<p>Two objects approach, collide, and separate. Only forces between the two objects act during the collision, so the momentum of the system is conserved:</p>
      \[p_{1i} + p_{2i} = p_{1f} + p_{2f}\]
      <p>That is one equation with two unknowns. The second equation comes from the <strong>coefficient of restitution</strong>, which compares how fast the objects separate to how fast they approached:</p>
      \[r = \left|\frac{v_{2f} - v_{1f}}{v_{1i} - v_{2i}}\right|, \qquad 0 \le r \le 1\]
      <ul>
        <li>\(r = 0\): <strong>perfectly inelastic</strong> collision. The objects stick together and move with the same velocity.</li>
        <li>\(r = 1\): <strong>elastic</strong> collision. Kinetic energy is conserved. This is rare in real life.</li>
        <li>\(0 &lt; r &lt; 1\): the most common case. The objects separate, and some kinetic energy is lost.</li>
      </ul>
      <p>You can also explore collisions with the <a href="https://phet.colorado.edu/en/simulation/legacy/collision-lab" target="_blank" rel="noopener">PhET Collision Lab (opens in a new tab)</a>, where r is called “elasticity”.</p>` }
];
const QORDER = SECTIONS.flatMap(s => s.qs);
const MAXPTS = QORDER.length * PTS_FIRST;

/* =========================================================
   State
   ========================================================= */
function freshQ(id) { return { order: shuffle(Q[id].options.map((_, i) => i)), attempts: [], status: 'open', pts: 0 }; }
function freshState() { const q = {}; QORDER.forEach(id => q[id] = freshQ(id)); return { name: '', started: false, cur: 0, finished: false, q }; }
function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY); if (!raw) return null;
    const s = JSON.parse(raw); if (!s || !s.q) return null;
    QORDER.forEach(id => { const e = s.q[id]; if (!e || !Array.isArray(e.order) || e.order.length !== Q[id].options.length) s.q[id] = freshQ(id); });
    return s;
  } catch (e) { return null; }
}
function saveState() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { } }
let state = loadState() || freshState();

/* =========================================================
   Rendering
   ========================================================= */
function questionHTML(id) {
  const q = Q[id], n = QORDER.indexOf(id) + 1, st = state.q[id];
  const opts = st.order.map((oi, k) => `<div class="opt" id="opt-${id}-${oi}"><input type="radio" name="r-${id}" id="r-${id}-${oi}" value="${oi}"><label for="r-${id}-${oi}"><span class="opt-letter" aria-hidden="true">${'ABCD'[k]}</span><span class="opt-text">${q.options[oi]}</span><span class="opt-status" id="st-${id}-${oi}"></span></label></div>`).join('');
  const fig = q.fig ? forceFig(`fig-${id}`, FIG[q.fig], null, FIG[q.fig].desc) : '';
  const sf = q.solFig ? forceFig(`sfig-${id}`, FIG[q.solFig[0]], q.solFig[1], q.solFig[2] + ' <span class="legend-key lk-pos" aria-hidden="true"></span>hatched: positive impulse <span class="legend-key lk-neg" aria-hidden="true"></span>cross-hatched: negative impulse') : '';
  return `<article class="q" id="q-${id}" aria-labelledby="qh-${id}">
    <div class="q-top"><h3 class="q-num" id="qh-${id}">Question ${n} of ${QORDER.length}</h3><span class="q-pts" id="qp-${id}"></span></div>
    <fieldset><legend>${q.stem}</legend>${fig}<div class="opts">${opts}</div></fieldset>
    <div class="q-actions"><button type="button" class="btn primary" data-act="check" data-q="${id}" id="chk-${id}">Check answer</button>
      <button type="button" class="btn ghost" data-act="hint" data-q="${id}" aria-expanded="false" aria-controls="hint-${id}" id="hb-${id}">Show hint</button></div>
    <div class="hint" id="hint-${id}" hidden><p><strong>Hint:</strong> ${q.hint}</p></div>
    <div class="fb" id="fb-${id}" role="status" aria-live="polite"></div>
    <div class="sol" id="sol-${id}" hidden><h4 tabindex="-1" id="solh-${id}">Detailed solution</h4>${q.solution}${sf}</div>
  </article>`;
}
function sectionHTML(sec, si) {
  let h = `<section class="unit" id="sec-${si}" hidden aria-labelledby="sec-${si}-h">
    <div class="unit-head"><span class="unit-letter" aria-hidden="true">${sec.letter}</span><div><p class="unit-kicker">Section ${sec.letter}, part ${si + 1} of ${SECTIONS.length}</p><h2 id="sec-${si}-h" tabindex="-1">${sec.title}</h2></div></div>
    <div class="prose">${sec.intro}</div>`;
  if (sec.introFig) h += forceFig(`ifig-${si}`, FIG[sec.introFig[0]], sec.introFig[1], sec.introFig[2]);
  if (sec.sim) h += `<div class="sim" role="region" aria-labelledby="simh-${sec.sim}"><h3 class="sim-h" id="simh-${sec.sim}"><span class="tag">Simulation</span>${sec.simTitle}</h3><p class="sim-intro">${sec.simIntro}</p><div id="simbody-${sec.sim}"></div></div>`;
  h += sec.qs.map(questionHTML).join('');
  const last = si === SECTIONS.length - 1;
  h += `<nav class="unit-nav" aria-label="Section navigation">${si > 0 ? `<button type="button" class="btn ghost" data-act="back">Back to section ${SECTIONS[si - 1].letter}</button>` : '<span></span>'}
    <div class="nav-right"><p class="gate" id="gate-${si}" aria-live="polite"></p><button type="button" class="btn primary" data-act="next" id="next-${si}">${last ? 'Finish tutorial' : 'Continue to section ' + SECTIONS[si + 1].letter}</button></div></nav></section>`;
  return h;
}
function welcomeHTML() {
  const heroVerts = [[0, 0], [1, 0], [1.6, 2], [2.2, 0], [4, 0]];

function buildPage() {
  $('main').innerHTML = welcomeHTML() + SECTIONS.map(sectionHTML).join('') + `<section class="finish" id="finish" hidden aria-labelledby="cert-h"></section>`;
  QORDER.forEach(id => applyQ(id, false));
  SECTIONS.forEach((s, si) => updateGate(si, false));
  SIMS.momentum($('simbody-momentum'));
  SIMS.rate($('simbody-rate'));
  SIMS.impulse($('simbody-impulse'));
  SIMS.explode($('simbody-explode'));
  SIMS.collide($('simbody-collide'));
  $('name-in').value = state.name || '';
  $('name-form').addEventListener('submit', e => {
    e.preventDefault();
    const v = $('name-in').value.trim();
    if (!v) { $('name-err').textContent = 'Enter your name to start.'; $('name-in').setAttribute('aria-invalid', 'true'); $('name-in').focus(); return; }
    $('name-in').removeAttribute('aria-invalid'); $('name-err').textContent = '';
    state.name = v; state.started = true; saveState(); show(state.cur || 0);
  });
}

/* question state -> DOM */
function applyQ(id, announce) {
  const q = Q[id], st = state.q[id], done = st.status !== 'open';
  const letterOf = oi => 'ABCD'[st.order.indexOf(oi)];
  q.options.forEach((_, oi) => {
    const wrap = $(`opt-${id}-${oi}`), inp = $(`r-${id}-${oi}`), chip = $(`st-${id}-${oi}`);
    wrap.classList.remove('wrong', 'right'); chip.textContent = '';
    if (st.attempts.includes(oi) && oi !== q.correct) { wrap.classList.add('wrong'); chip.textContent = 'Incorrect'; inp.disabled = true; inp.checked = false; }
    if (done) { inp.disabled = true; if (oi === q.correct) { wrap.classList.add('right'); chip.textContent = st.status === 'missed' ? 'Correct answer' : 'Correct'; inp.checked = st.status !== 'missed'; } }
  });
  const left = 2 - st.attempts.length;
  $(`qp-${id}`).textContent = done ? `${st.pts} of ${PTS_FIRST} points` : `${PTS_FIRST} points, ${left} attempt${left === 1 ? '' : 's'} left`;
  $(`chk-${id}`).disabled = done;
  $(`sol-${id}`).hidden = !done;
  const fb = $(`fb-${id}`), lastPick = st.attempts[st.attempts.length - 1];
  let msg = '';
  if (st.status === 'first') msg = `<p class="ok"><span aria-hidden="true">✓ </span><strong>Correct on your first try.</strong> +${PTS_FIRST} points. The detailed solution is below.</p>`;
  else if (st.status === 'second') msg = `<p class="ok"><span aria-hidden="true">✓ </span><strong>Correct on your second try.</strong> +${PTS_SECOND} points. The detailed solution is below.</p>`;
  else if (st.status === 'missed') msg = `<p class="bad"><span aria-hidden="true">✗ </span><strong>Not correct, 0 points.</strong> ${q.why[lastPick] || ''} The correct answer is ${letterOf(q.correct)}: ${q.options[q.correct]}. Work through the solution below.</p>`;
  else if (st.attempts.length === 1) msg = `<p class="bad"><span aria-hidden="true">✗ </span><strong>Not quite.</strong> ${q.why[lastPick] || ''} You have one attempt left. The hint may help.</p>`;
  if (announce || done || st.attempts.length) fb.innerHTML = msg;
  if (announce && done) setTimeout(() => $(`solh-${id}`).focus(), 60);
}
function check(id) {
  const st = state.q[id]; if (st.status !== 'open') return;
  const sel = document.querySelector(`input[name="r-${id}"]:checked`);
  if (!sel) { $(`fb-${id}`).innerHTML = '<p class="warn">Choose one of the answers first, then select Check answer.</p>'; return; }
  const oi = +sel.value; st.attempts.push(oi);
  if (oi === Q[id].correct) { st.status = st.attempts.length === 1 ? 'first' : 'second'; st.pts = st.attempts.length === 1 ? PTS_FIRST : PTS_SECOND; }
  else if (st.attempts.length >= 2) { st.status = 'missed'; st.pts = 0; }
  saveState(); applyQ(id, true);

    const draw = ev => {
      const M = model(), tsl = $('co-t');
      const key = [M.m1, M.m2, M.v1, M.v2, M.r].join(',');
      if (key !== lastKey) { lastKey = key; tsl.max = M.Tend.toFixed(2); if (ev !== 'init') { tsl.value = 0; tsl.dispatchEvent(new Event('input')); return; } }
      const t = gt(), S = at(M, t);
      const c1 = X(S.x1), c2 = X(S.x2), rp1 = M.R1 * PX, rp2 = M.R2 * PX, cy = 120;
      let g = `<line x1="8" y1="${cy + 26}" x2="512" y2="${cy + 26}" class="ground"/>`;
      for (let x = 0; x <= 3; x++) g += `<line x1="${X(x)}" y1="${cy + 26}" x2="${X(x)}" y2="${cy + 34}" class="ground" style="stroke-width:2"/><text x="${X(x)}" y="${cy + 50}" text-anchor="middle" class="muted">${x} m</text>`;
      g += `<circle cx="${c1}" cy="${cy}" r="${rp1}" class="ball1"/><text x="${c1}" y="${cy + 6}" text-anchor="middle" class="ball1-t">1</text>`;
      g += `<circle cx="${c2}" cy="${cy}" r="${rp2}" class="ball2"/><text x="${c2}" y="${cy + 6}" text-anchor="middle" class="ball2-t">2</text>`;
      g += arrowSVG(c1, 40, S.u1 * 30, 'arr-v') + `<text x="${c1}" y="22" text-anchor="middle" style="font-size:15px">${fmtS(S.u1, 2)}</text>`;
      g += arrowSVG(c2, 62, S.u2 * 30, 'arr-v') + `<text x="${c2}" y="86" text-anchor="middle" style="font-size:15px">${fmtS(S.u2, 2)}</text>`;
      $('co-g').innerHTML = g;
      const KE = (m, v) => 0.5 * m * v * v, ki = KE(M.m1, M.v1) + KE(M.m2, M.v2), kf = KE(M.m1, M.v1f) + KE(M.m2, M.v2f);
      const row = (n, m, a, b) => `<tr><th scope="row">${n}</th><td>${fmtS(a, 2)}</td><td>${fmtS(m * a, 3)}</td><td>${fmtS(b, 2)}</td><td>${fmtS(m * b, 3)}</td><td>${fmt(KE(m, a), 3)}</td><td>${fmt(KE(m, b), 3)}</td></tr>`;
      $('co-tb').innerHTML = row('Ball 1', M.m1, M.v1, M.v1f) + row('Ball 2', M.m2, M.v2, M.v2f) +
        `<tr><th scope="row">Total</th><td></td><td>${fmtS(M.P, 3)}</td><td></td><td>${fmtS(M.m1 * M.v1f + M.m2 * M.v2f, 3)}</td><td>${fmt(ki, 3)}</td><td>${fmt(kf, 3)}</td></tr>`;
      const msg = !M.hit ? 'With these velocities ball 1 never catches up with ball 2, so they do not collide. Make v₁ greater than v₂.'
        : `${S.after ? 'After' : 'Before'} the collision (contact at t = ${fmt(M.tc, 2)} s). Momentum stays ${fmtS(M.P, 3)} kg·m/s; kinetic energy ${M.r >= 0.999 ? 'is conserved' : `drops from ${fmt(ki, 3)} J to ${fmt(kf, 3)} J`}.`;
      $('co-msg').textContent = msg; if (!M.hit) $('co-msg').classList.add('warnline'); else $('co-msg').classList.remove('warnline');
      $('co-desc').textContent = `Ball 1 at ${fmt(S.x1, 2)} m moving at ${fmtS(S.u1, 2)} m/s; ball 2 at ${fmt(S.x2, 2)} m moving at ${fmtS(S.u2, 2)} m/s. ${msg}`;
      if (ev === 'change') $('co-live').textContent = M.hit ? `Final velocities: ball 1 ${fmtS(M.v1f, 2)} metres per second, ball 2 ${fmtS(M.v2f, 2)} metres per second. ${msg}` : msg;
    };
    gm1 = bindSlider('co-m1', 'kg', 1, draw); gm2 = bindSlider('co-m2', 'kg', 1, draw); gv1 = bindSlider('co-v1', 'm/s', 1, draw);
    gv2 = bindSlider('co-v2', 'm/s', 1, draw); gr = bindSlider('co-r', '', 2, draw); gt = bindSlider('co-t', 's', 2, draw);
    makePlayer($('co-t'), $('co-play'), 1000, () => draw('change'));
    draw('init');
  }
};

/* =========================================================
   Boot
   ========================================================= */
buildPage();
$('main').addEventListener('click', onClick);
if (state.started) { show(state.finished && state.cur >= SECTIONS.length ? SECTIONS.length : state.cur); }
else { $('welcome').hidden = false; }
</script>
</body>
</html>
